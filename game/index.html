<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  .hud-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar { width: 180px; height: 16px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); border-radius: 8px; overflow: hidden; }
  .bar .fill { height: 100%; width: 100%; background: #2ecc71; }
  .stat { background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: 15px; }
  .cash { color: #7dff9a; }
  .stars { letter-spacing: 2px; font-size: 18px; }
  .objective { position: absolute; top: 58px; left: 12px; max-width: 420px; background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; border-left: 4px solid #ffd54a; }
  .station { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  .help { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 8px; font-size: 12px; color: #ddd; }
  .toasts { position: absolute; bottom: 52px; left: 12px; display: flex; flex-direction: column; gap: 6px; }
  .toast { background: rgba(0,0,0,.65); padding: 7px 11px; border-radius: 8px; font-size: 14px; }
  .minimap { position: absolute; bottom: 12px; right: 12px; border: 2px solid rgba(255,255,255,.5); border-radius: 8px; background: #1d2b1a; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(10,20,40,.55), rgba(5,10,20,.88)); padding: 20px; }
  .screen h1 { font-size: 64px; letter-spacing: 6px; margin: 0 0 12px; color: #ffd54a; text-shadow: 0 4px 24px rgba(0,0,0,.8); }
  .screen p { font-size: 18px; max-width: 560px; line-height: 1.5; margin: 6px 0; }
  .screen .hint { font-size: 14px; color: #ffd54a; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: open-world crime game. Drive, steal cars, outrun the police and buy back Dani's sister Lila."></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
