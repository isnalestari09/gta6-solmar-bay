<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Bay — open-world crime game: 8 missions, a coastal city, cars to steal, police, radio. Built for make.fun gta6-01.">
<title>Solmar Bay — Open World Crime Game</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #101418; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #cash { position: absolute; top: 14px; left: 16px; font-size: 28px; font-weight: 800; text-shadow: 0 2px 6px #000; }
  #stars { position: absolute; top: 48px; left: 16px; font-size: 24px; letter-spacing: 2px; text-shadow: 0 2px 6px #000; }
  #health { position: absolute; top: 82px; left: 16px; font-size: 18px; text-shadow: 0 2px 6px #000; }
  #speed { position: absolute; bottom: 16px; left: 16px; font-size: 20px; text-shadow: 0 2px 6px #000; }
  #radio { position: absolute; bottom: 16px; right: 16px; font-size: 15px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; }
  #objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 420px; max-width: 80vw; background: rgba(0,0,0,.55); border-radius: 8px; padding: 8px 12px; }
  #objective-text { font-size: 14px; display: block; }
  #objective-bar { height: 6px; background: #ffc93c; border-radius: 3px; margin-top: 6px; width: 0%; transition: width .3s; }
  #toast { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 18px; background: rgba(0,0,0,.65); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #minimap { position: absolute; top: 14px; right: 14px; border: 2px solid rgba(255,255,255,.6); border-radius: 8px; background: #1e2b1e; }
  #screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 12, 20, .72); text-align: center; padding: 20px; }
  #screen h1 { font-size: 64px; margin: 0; letter-spacing: 6px; color: #ffc93c; text-shadow: 0 4px 18px #000; }
  #screen p { font-size: 18px; max-width: 640px; line-height: 1.5; }
  #screen-hint { color: #ffc93c; font-weight: 700; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
